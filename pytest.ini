[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Load the Home Assistant plugin before the entry-point plugins. Importing
# homeassistant aliases httpx to httpx2, which only works if nothing has
# imported httpx yet; the respx plugin does, and pytest loads entry points in
# filesystem order, which differs between CI runners.
addopts = -p pytest_homeassistant
